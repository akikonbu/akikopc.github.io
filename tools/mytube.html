<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="YouTube Data API v3 を使ってブラウザだけで動作する YouTube クライアント MyTube" />
<title>MyTube - YouTube Data API クライアント</title>
<style>
/* ============================================================
   MyTube - single file YouTube client
   ============================================================ */
:root{
  --bg:#0f0f0f;
  --surface:#272727;
  --surface-hover:#3f3f3f;
  --border:#303030;
  --text:#f1f1f1;
  --text2:#aaaaaa;
  --red:#ff0033;
  --blue:#3ea6ff;
  --hdr:56px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"Roboto","Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,-apple-system,sans-serif;
  font-feature-settings:"palt";
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#4d4d4d;border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-width:thin;scrollbar-color:#4d4d4d transparent}

/* ---------- utilities ---------- */
.row{display:flex;align-items:center}
.grow{flex:1;min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.line3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.line4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.muted{color:var(--text2)}
.small{font-size:12px}
.hide-mobile{display:initial}
.only-mobile{display:none}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border:0;border-radius:18px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;user-select:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--text);color:var(--bg)}
.btn-primary:hover{background:#d9d9d9}
.btn-secondary{background:var(--surface);color:var(--text)}
.btn-secondary:hover{background:var(--surface-hover)}
.btn-ghost{background:transparent;color:var(--text)}
.btn-ghost:hover{background:var(--surface)}
.btn-lg{height:40px;padding:0 20px}
.chip{height:32px;padding:0 12px;border:0;border-radius:8px;background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.chip:hover{background:var(--surface-hover)}
.chip.active{background:var(--text);color:var(--bg)}
.icon-btn{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-hover)}
.icon-btn.on{background:var(--surface)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- header ---------- */
#hdr{
  position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:60;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--bg);padding:0 8px;
}
.hdr-left{display:flex;align-items:center;gap:2px}
.logo{display:flex;align-items:center;gap:2px;padding:0 8px;font-size:20px;font-weight:700;letter-spacing:-.06em}
.logo sup{font-size:10px;font-weight:400;letter-spacing:.02em;color:var(--text2);margin-left:2px}
.hdr-right{display:flex;align-items:center;gap:4px}
.avatar-btn{width:32px;height:32px;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;font-weight:600;background:linear-gradient(135deg,#c026d3,#4f46e5);margin-left:4px;flex:none}
.status-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;border:1px solid transparent;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.status-btn.demo{border-color:rgba(245,158,11,.4);background:rgba(245,158,11,.12);color:#fcd34d}
.status-btn.live{border-color:rgba(34,197,94,.35);background:rgba(34,197,94,.12);color:#86efac}
.status-btn.ok{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.14);color:#93c5fd}
.src-badge{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.6}
.src-badge .ic{flex:none;margin-top:2px}
.src-badge.ok{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#bbf7d0}
.src-badge.demo{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.12);color:#fde68a}
.src-badge .sub{display:block;font-size:11px;opacity:.85;word-break:break-all}
.status-btn:hover{filter:brightness(1.25)}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}

/* ---------- search ---------- */
#search-wrap{position:relative;flex:1;max-width:720px;display:flex;align-items:center;justify-content:center}
.search-form{display:flex;align-items:center;flex:1}
.search-field{display:flex;align-items:center;flex:1;height:40px;background:#121212;border:1px solid var(--border);border-right:0;border-radius:20px 0 0 20px;padding:0 4px 0 16px;min-width:0}
.search-field:focus-within{border-color:var(--blue)}
.search-field input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;color:var(--text);font-size:16px}
.search-field input::placeholder{color:var(--text2)}
.search-clear{width:32px;height:32px;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;display:none;align-items:center;justify-content:center;flex:none}
.search-clear:hover{background:var(--surface-hover)}
.search-form.has-value .search-clear{display:inline-flex}
.search-submit{width:64px;height:40px;border:1px solid var(--border);border-left:0;border-radius:0 20px 20px 0;background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.search-submit:hover{background:var(--surface-hover)}
.mic-btn{width:40px;height:40px;margin-left:12px;border:0;border-radius:50%;background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.mic-btn:hover{background:var(--surface-hover)}
.mic-btn.listening{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.suggest{position:absolute;top:48px;left:0;right:52px;background:var(--surface);border-radius:12px;padding:8px 0;box-shadow:0 8px 30px rgba(0,0,0,.55);z-index:70;max-height:60vh;overflow:auto;display:none}
.suggest.open{display:block;animation:fade .18s ease-out}
.suggest-item{display:flex;align-items:center;gap:16px;padding:8px 16px;cursor:pointer;font-size:15px;font-weight:500}
.suggest-item:hover,.suggest-item.active{background:var(--surface-hover)}
.suggest-item .ic{color:var(--text2);flex:none}
.suggest-item .rm{margin-left:auto;color:var(--blue);font-size:12px;opacity:0}
.suggest-item:hover .rm{opacity:1}
#mobile-search{position:fixed;inset:0 0 auto 0;height:var(--hdr);background:var(--bg);display:none;align-items:center;gap:8px;padding:0 8px;z-index:80}
body.searching #mobile-search{display:flex}
body.searching #hdr{display:none}

/* ---------- sidebar ---------- */
#sidebar{
  position:fixed;top:var(--hdr);left:0;bottom:0;width:240px;z-index:50;
  overflow-y:auto;overscroll-behavior:contain;background:var(--bg);padding:12px 12px 48px;display:none;
}
body.sb-expanded #sidebar{display:block}
body.sb-mini #sidebar{display:flex;width:72px;flex-direction:column;align-items:center;padding:4px 0 24px;gap:2px}
body.route-watch #sidebar{display:none}
#main{padding-top:var(--hdr);min-height:100vh}
body.sb-expanded #main{padding-left:240px}
body.sb-mini #main{padding-left:72px}
body.route-watch #main{padding-left:0}
.nav-item{display:flex;align-items:center;gap:24px;height:40px;padding:0 12px;border-radius:10px;font-size:14px;cursor:pointer}
.nav-item:hover{background:var(--surface)}
.nav-item.active{background:var(--surface);font-weight:500}
.nav-item .ic{flex:none}
.nav-sep{height:1px;background:var(--border);margin:12px 0}
.stack12{display:flex;flex-direction:column;gap:12px}
.status-card{display:flex;align-items:flex-start;gap:12px;margin-top:8px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:12px;line-height:1.7}
.status-card .ic{flex:none;margin-top:2px}
.status-card.demo{border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.12);color:#fcd34d}
.status-card.ok{border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.1);color:#86efac}
.status-card:hover{filter:brightness(1.25)}
.nav-label{padding:8px 12px 6px;font-size:16px;font-weight:500}
.nav-note{padding:6px 12px;font-size:12px;line-height:1.7;color:var(--text2)}
.sb-foot{padding:12px;font-size:12px;line-height:1.8;color:var(--text2)}
.mini-item{width:64px;height:74px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;cursor:pointer}
.mini-item:hover{background:var(--surface)}
.mini-item.active{background:var(--surface);font-weight:500}
body.sb-expanded .mini-only{display:none}
body:not(.sb-mini) .mini-only{display:none}
.sub-avatar{width:24px;height:24px;border-radius:50%;flex:none;object-fit:cover;background:var(--surface)}

/* ---------- drawer (mobile / compact) ---------- */
#drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
body.drawer-open #drawer-overlay{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--bg);z-index:95;overflow-y:auto;transform:translateX(-100%);transition:transform .2s;padding-bottom:40px}
body.drawer-open #drawer{transform:translateX(0)}
.drawer-head{position:sticky;top:0;display:flex;align-items:center;gap:2px;height:var(--hdr);background:var(--bg);padding:0 8px;z-index:2}

/* ---------- chips bar ---------- */
.chipbar{position:sticky;top:var(--hdr);z-index:40;background:var(--bg);padding:8px 0}
.chipbar-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chipbar-scroll::-webkit-scrollbar{display:none}
.chipbar .edge{position:absolute;top:0;bottom:0;width:80px;display:flex;align-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.chipbar .edge.show{opacity:1;pointer-events:auto}
.chipbar .edge.l{left:0;justify-content:flex-start;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.chipbar .edge.r{right:0;justify-content:flex-end;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.chipbar .edge button{pointer-events:auto}

/* ---------- video cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:40px 16px}
.card{display:flex;flex-direction:column;gap:12px}
.thumb-wrap{position:relative}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--surface);transition:opacity .3s}
.thumb.sm{border-radius:8px}
.badge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:500;padding:1px 5px;border-radius:4px}
.badge.live{background:var(--red);left:6px;right:auto}
.save-pill{position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:4px;background:rgba(0,0,0,.8);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card:hover .save-pill,.save-pill.on{opacity:1}
.card-body{display:flex;gap:12px}
.avatar{border-radius:50%;object-fit:cover;flex:none;background:var(--surface)}
.avatar-letter{display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:500;flex:none}
.card-title{font-size:16px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:13px;color:var(--text2);line-height:1.6}
.card-ch{font-size:13px;color:var(--text2)}
.card-ch:hover{color:var(--text)}
.more-btn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--text);cursor:pointer;opacity:0;flex:none;display:flex;align-items:center;justify-content:center}
.card:hover .more-btn,.more-btn.open{opacity:1}
.menu{position:absolute;z-index:120;width:240px;background:var(--surface);border-radius:12px;padding:8px 0;box-shadow:0 10px 32px rgba(0,0,0,.6);animation:fade .15s ease-out}
.menu button{display:flex;align-items:center;gap:16px;width:100%;padding:10px 16px;border:0;background:transparent;color:var(--text);font-size:14px;text-align:left;cursor:pointer}
.menu button:hover{background:var(--surface-hover)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* list card (search results) */
.list-card{display:flex;flex-direction:column;gap:12px}
.list-thumb{width:100%}
.list-body{display:flex;gap:8px;min-width:0}
.list-title{font-size:18px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list-desc{font-size:12px;color:var(--text2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list-ch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin:10px 0}
.list-ch:hover{color:var(--text)}

/* compact card (related) */
.compact{display:flex;gap:8px}
.compact .thumb-wrap{width:168px;flex:none}
.compact .t{font-size:14px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* skeleton */
.sk{background:linear-gradient(90deg,#232323 25%,#333 50%,#232323 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{display:flex;justify-content:center;padding:32px 0}
.spinner i{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--text);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- states ---------- */
.state{max-width:560px;margin:0 auto;padding:64px 16px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.state.compact{padding:24px 16px}
.state .ic{color:var(--text2)}
.state h3{margin:0;font-size:18px;font-weight:500}
.state p{margin:0;font-size:14px;color:var(--text2);line-height:1.8}
.state .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* ---------- watch page ---------- */
.watch{max-width:1754px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.player{width:100%;aspect-ratio:16/9;background:#000;position:relative}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.watch-main{min-width:0;flex:1;padding:0}
#watch-info{padding:0 16px}
.watch-aside{width:100%;padding:16px 16px 40px}
.watch h1{font-size:20px;font-weight:600;line-height:1.4;margin:12px 0 0}
.watch-row{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.ch-row{display:flex;align-items:center;gap:12px}
.ch-name{font-size:16px;font-weight:500}
.actions{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.actions::-webkit-scrollbar{display:none}
.pill-group{display:flex;align-items:center;height:36px;border-radius:18px;background:var(--surface);flex:none}
.pill-group button{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;border:0;background:transparent;color:var(--text);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.pill-group button:hover{background:var(--surface-hover)}
.pill-group .sep{width:1px;height:24px;background:var(--border)}
.pill-group button.on svg{fill:currentColor}
.desc{margin-top:12px;background:var(--surface);border-radius:12px;padding:12px;font-size:14px;line-height:1.8;cursor:pointer}
.desc:hover{background:#2e2e2e}
.desc.open{cursor:default}
.desc .body{white-space:pre-wrap;word-break:break-word;margin-top:8px}
.desc .more{font-weight:500;margin-top:8px;display:inline-block}
.desc a,.cmt a{color:var(--blue);word-break:break-all}
.tag{color:var(--blue)}
.cmt-count{font-size:20px;font-weight:600;margin:32px 0 24px}
.cmt{display:flex;gap:16px}
.cmt .nick{font-size:13px;font-weight:500}
.cmt .text{font-size:14px;line-height:1.8;white-space:pre-wrap;word-break:break-word;margin:4px 0 0}
.cmt .btns{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text2);margin-top:4px}
.cmt .btns button{border:0;background:transparent;color:var(--text2);cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;gap:6px;font-size:12px}
.cmt .btns button:hover{background:var(--surface)}
.cmt .reply{margin-top:6px;color:var(--blue);border:0;background:transparent;font-size:13px;font-weight:500;padding:8px 12px;border-radius:18px;cursor:pointer}
.cmt .reply:hover{background:rgba(62,166,255,.1)}
.cmt-list{display:flex;flex-direction:column;gap:24px}
.notice{margin-top:12px;border-radius:12px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);padding:16px;font-size:14px;line-height:1.8}
.notice strong{display:block;margin-bottom:4px}

/* ---------- channel page ---------- */
.banner{width:100%;aspect-ratio:6.2/1;border-radius:16px;object-fit:cover}
.ch-head{display:flex;flex-direction:column;gap:16px;margin-top:16px}
.ch-desc{max-width:720px;text-align:left;font-size:14px;color:var(--text2);line-height:1.8;background:transparent;border:0;padding:0;cursor:pointer}
.ch-tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-top:24px}
.ch-tabs div{padding:12px 2px;border-bottom:2px solid var(--text);font-size:14px;font-weight:500}
.ch-stats{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--text2);margin-top:4px}
.ch-handle{color:var(--text);font-weight:500}

/* ---------- page shells ---------- */
.page{max-width:1284px;margin:0 auto;padding:24px 16px 40px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.page-head .badge-ic{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;flex:none}
.page-head h1{margin:0;font-size:24px;font-weight:600}
.sub-tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:24px}
.sub-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--text2);font-size:14px;font-weight:500;padding:10px 2px;cursor:pointer}
.sub-tabs button.active{border-bottom-color:var(--text);color:var(--text)}
.rank{width:32px;flex:none;text-align:right;font-size:18px;color:var(--text2);padding-top:2px}
.search-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:20px}
.demo-banner{position:relative;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(245,158,11,.35);border-radius:16px;padding:16px;margin-bottom:24px;background:linear-gradient(90deg,rgba(245,158,11,.16),rgba(249,115,22,.06),transparent)}
.demo-banner .ic{width:44px;height:44px;border-radius:50%;background:rgba(245,158,11,.2);color:#fcd34d;display:flex;align-items:center;justify-content:center;flex:none}
.demo-banner h2{margin:0;font-size:16px;font-weight:500}
.demo-banner p{margin:2px 0 0;font-size:14px;color:var(--text2);line-height:1.8}
.live-banner{position:relative;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(59,130,246,.35);border-radius:16px;padding:16px;margin-bottom:24px;background:linear-gradient(90deg,rgba(59,130,246,.16),rgba(139,92,246,.07),transparent)}
.live-banner .ic{width:44px;height:44px;border-radius:50%;background:rgba(59,130,246,.2);color:#93c5fd;display:flex;align-items:center;justify-content:center;flex:none}
.live-banner h2{margin:0;font-size:16px;font-weight:500}
.live-banner p{margin:2px 0 0;font-size:14px;color:var(--text2);line-height:1.8}
.live-banner .close{position:absolute;top:8px;right:8px}
.text-strong{font-weight:600;color:var(--text)}
.demo-banner .close{position:absolute;top:8px;right:8px}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{width:100%;max-width:672px;max-height:92vh;overflow-y:auto;background:#212121;border-radius:16px 16px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-head{position:sticky;top:0;background:#212121;display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border);z-index:2}
.modal-head h2{margin:0;font-size:18px;font-weight:500}
.modal-body{padding:24px;display:flex;flex-direction:column;gap:32px}
.modal-body h3{margin:0 0 8px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.modal-body p{margin:0 0 16px;font-size:14px;color:var(--text2);line-height:1.9}
.modal-body ol{margin:0;padding-left:20px;font-size:14px;color:var(--text2);line-height:1.9}
.modal-body a{color:var(--blue);text-decoration:underline}
.field{position:relative;display:flex;gap:8px}
.input{flex:1;min-width:0;height:44px;background:#121212;border:1px solid var(--border);border-radius:10px;padding:0 44px 0 14px;color:var(--text);font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;outline:none}
.input:focus{border-color:var(--blue)}
.input.plain{font-family:inherit;padding-right:14px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--text2);cursor:pointer;padding:8px;border-radius:50%}
.eye:hover{background:var(--surface-hover)}
.result{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;display:flex;gap:8px;line-height:1.7}
.result.ok{background:rgba(34,197,94,.12);color:#bbf7d0}
.result.bad{background:rgba(239,68,68,.12);color:#fecaca}
.box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:16px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- toasts ---------- */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:16px;background:var(--text);color:var(--bg);border-radius:8px;padding:12px 16px;font-size:14px;pointer-events:auto;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .2s ease-out}
.toast button{border:0;background:transparent;color:#1d4ed8;font-weight:600;cursor:pointer;font-size:14px}
.toast .x{color:#3f3f41;opacity:.8;display:flex}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:767px){
  .hide-mobile{display:none}
  .only-mobile{display:inline-flex}
  #search-wrap{display:none}
  body.sb-mini #sidebar{display:none}
  body.sb-mini #main{padding-left:0}
  body.sb-expanded #main{padding-left:0}
  .more-btn{opacity:1}
  .save-pill{opacity:1}
  #status-btn{display:none}
  .hdr-right{gap:0}
}
@media (min-width:640px){
  .list-card{flex-direction:row;gap:16px}
  .list-thumb{width:300px;flex:none}
  .ch-head{flex-direction:row;align-items:center;gap:24px}
  .demo-banner{flex-direction:row;align-items:center;gap:20px;padding:20px}
}
@media (min-width:1024px){

  .watch-aside{width:402px;flex:none;padding:0 0 40px}

  .list-thumb{width:360px}
  .modal-bg{align-items:center;padding:24px}
  .modal{border-radius:16px}
}
@media (min-width:768px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}

      sessionStorage.removeItem("mt:" + k);

async function ytRequest(ep, params, opt) {

  if (!key) throw new ApiError("APIキーが設定されていません", 0, "noKey");
  const u = new URL("https://www.googleapis.com/youtube/v3/" + ep);
  Object.keys(params).forEach(function (k) {

  });
  const ck = ep + "?" + u.searchParams.toString();
  if (!opt.noCache) {
    const cached = cacheGet(ck);
    if (cached !== undefined) return cached;
  }
  u.searchParams.set("key", key);
  let res;
  try { res = await fetch(u.toString()); }
  catch (e) { throw new ApiError("ネットワークエラー", 0, "network"); }
  if (!res.ok) {
    let msg = "HTTP " + res.status;
    let reason = res.status === 403 ? "forbidden" : res.status === 404 ? "notFound" : "unknown";
    try {
      const b = await res.json();
      if (b && b.error) {
        msg = b.error.message || msg;
        reason = (b.error.errors && b.error.errors[0] && b.error.errors[0].reason) || b.error.status || reason;
      }
    } catch (e) {}
    throw new ApiError(msg, res.status, reason);
  }
  const data = await res.json();
  if (!opt.noCache) cacheSet(ck, data, opt.ttl);
  return data;
}

/** Tries every known instance, remembering the first one that answers. */
async function liveFetch(path, params, opt) {

  if (!opt.noCache) { const c = cacheGet(ck); if (c !== undefined) return c; }
  let lastErr = null;
  for (let a = 0; a < LIVE_HOSTS.length; a++) {
    const i = (liveIdx + a) % LIVE_HOSTS.length;
    try {
      const data = await fetchJSON(LIVE_HOSTS[i] + path + (qs ? "?" + qs : ""), opt.timeout);
      if (liveIdx !== i) { liveIdx = i; store.setRaw(KEYS.liveIdx, String(i)); }
      if (liveDown) { liveDown = false; updateStatusBtn(); }
      if (!opt.noCache) cacheSet(ck, data, opt.ttl);
      return data;
    } catch (e) { lastErr = e; }

/** Fetches /streams for one video (used to fill in missing lengths on trending). */

/** Trending responses omit durations, so top them up a few at a time. */
async function enrichDurations(list, limit) {
  const targets = (list || []).filter(function (v) { return v && !v.durationSec && !v._enr; }).slice(0, limit || 12);
  if (!targets.length) return false;
  targets.forEach(function (v) { v._enr = true; });
  const metas = await Promise.all(targets.map(function (v) { return liveStreamMeta(v.id); }));
  let changed = false;
  metas.forEach(function (d, i) {
    if (!d) return;
    const v = targets[i];
    if (d.duration > 0) v.durationSec = Math.round(d.duration);
    if (!v.publishedAt && typeof d.uploadDate === "string" && /\d{4}-\d{2}-\d{2}/.test(d.uploadDate)) {
      const dd = new Date(d.uploadDate);
      if (!isNaN(dd.getTime())) v.publishedAt = dd.toISOString();
    }
    if (v.viewCount === undefined && typeof d.views === "number" && d.views >= 0) v.viewCount = d.views;
    if (v.likeCount === undefined && typeof d.likes === "number" && d.likes >= 0) v.likeCount = d.likes;
    if (!v.channelThumbnail && d.uploaderAvatar) v.channelThumbnail = unproxyUrl(d.uploaderAvatar);
    if (!v.channelId && d.uploaderUrl) v.channelId = chIdFromUrl(d.uploaderUrl);
    if (!v.tags && d.keywords) v.tags = d.keywords.slice(0, 12);
    changed = true;
  });
  return changed;
}

  let next = d.nextpage || undefined;
  if (!token && !items.length && next) {

      const more = (d2.relatedStreams || []).map(pVideo).filter(Boolean);
      if (more.length) { items = more; next = d2.nextpage || undefined; }
    } catch (e) { /* keep empty */ }
  }
  return { channel: pChannel(d), items: items, nextPageToken: next };

/** Video detail + channel + related. /streams is rate-limited on some instances, so
 *  it falls back to oEmbed (title/channel) plus a title search (stats, related). */
async function liveWatch(id) {
  let video = null, channel = null, related = [];
  try {
    const d = await liveFetch("/streams/" + id, {}, { ttl: 600000 });
    const dateRaw = d.uploadDate || "";
    video = {
      id: id, title: d.title || "", description: decodeEntities(stripTags(d.description)) || "",
      thumbnail: ytThumb(id, "hq"), thumbAlt: "",
      channelId: chIdFromUrl(d.uploaderUrl) || "",
      channelTitle: d.uploader || "",
      channelThumbnail: unproxyUrl(d.uploaderAvatar),
      publishedAt: /\d{4}-\d{2}-\d{2}/.test(dateRaw) ? new Date(dateRaw).toISOString() : "",
      publishedText: /ago$/i.test(dateRaw) ? dateRaw : "",
      viewCount: typeof d.views === "number" && d.views >= 0 ? d.views : undefined,
      likeCount: typeof d.likes === "number" && d.likes >= 0 ? d.likes : undefined,
      durationSec: Math.max(0, d.duration || 0),
      isLive: !!d.livestream, tags: (d.keywords || []).slice(0, 12),
    };
    channel = {
      id: video.channelId, title: video.channelTitle, description: "",
      thumbnail: video.channelThumbnail, banner: "",
      subscriberCount: typeof d.uploaderSubscriberCount === "number" && d.uploaderSubscriberCount >= 0 ? d.uploaderSubscriberCount : undefined,
    };
    related = (d.relatedStreams || []).map(pVideo).filter(Boolean);
  } catch (e) {
    /* fallback: oEmbed + title search */
    const info = await oembed(id);
    let title = info && info.title ? info.title : "";
    const chName = info && info.author_name ? info.author_name : "";
    if (title) {
      try {
        const res = await liveSearch({ q: title });
        const mine = res.items.filter(function (v) { return v.id === id; })[0];
        if (mine) {
          video = mine;
          video.title = title || mine.title;
          channel = { id: mine.channelId, title: chName || mine.channelTitle, description: "",
            thumbnail: mine.channelThumbnail, banner: "", subscriberCount: undefined };
        }
        related = res.items.filter(function (v) { return v.id !== id; });
      } catch (e2) { /* ignore */ }
    }
    if (!video) {
      if (!title) return { video: null, channel: null, related: [] };
      video = { id: id, title: title, description: "", thumbnail: ytThumb(id, "hq"), thumbAlt: "",
        channelId: "", channelTitle: chName, channelThumbnail: "", publishedAt: "", publishedText: "",
        viewCount: undefined, likeCount: undefined, durationSec: 0, isLive: false, tags: [] };
      channel = { id: "", title: chName, description: "", thumbnail: "", banner: "", subscriberCount: undefined };
      try {
        const rel = await liveSearch({ q: chName || title });
        related = rel.items.filter(function (v) { return v.id !== id; });
      } catch (e3) { /* ignore */ }
    }
  }
  return { video: video, channel: channel, related: related };
}

/** Home / trending feed. Trending returns a single page, so further pages use

/* ---------- real API ---------- */
async function realVideosByIds(ids) {
  const uniq = [];
  ids.forEach(function (id) { if (id && uniq.indexOf(id) < 0) uniq.push(id); });
  const out = [];
  for (let i = 0; i < uniq.length; i += 50) {
    const group = uniq.slice(i, i + 50);
    const d = await ytRequest("videos", { part: "snippet,statistics,contentDetails", id: group.join(","), maxResults: 50 });
    (d.items || []).forEach(function (r) { out.push(mapVideo(r)); });
  }
  const byId = {};
  out.forEach(function (v) { byId[v.id] = v; });
  return uniq.map(function (id) { return byId[id]; }).filter(Boolean);
}
async function realChannelsByIds(ids) {
  const uniq = [];
  ids.forEach(function (id) { if (id && uniq.indexOf(id) < 0) uniq.push(id); });
  const out = [];
  for (let i = 0; i < uniq.length; i += 50) {
    const group = uniq.slice(i, i + 50);
    const d = await ytRequest("channels", { part: "snippet,statistics,brandingSettings", id: group.join(","), maxResults: 50 }, { ttl: 3600000 });
    (d.items || []).forEach(function (r) { out.push(mapChannel(r)); });

}
async function enrichChannels(videos) {

  if (!ids.length) return videos;
  try {
    const chs = await realChannelsByIds(ids);
    const m = {};
    chs.forEach(function (c) { m[c.id] = c.thumbnail; });
    videos.forEach(function (v) { v.channelThumbnail = m[v.channelId] || v.channelThumbnail; });
  } catch (e) {}

}
async function realPopular(o) {

    regionCode: state.region, videoCategoryId: o.category || undefined, maxResults: 24, pageToken: o.pageToken });

async function realSearch(o) {

    const m = {};

const NOISE = /\b(official|music|video|mv|m\/v|lyric|lyrics|audio|hd|4k|remaster(?:ed)?|ft\.?|feat\.?|full|ver\.?|edit|youtube|clip|short film|trailer)\b/gi;

/* ---------- demo API ---------- */
const demoDelay = function () { return sleep(180 + Math.random() * 260); };
function paginate(items, pageToken, size) {
  size = size || 12;

  return { items: items.slice(offset, offset + size), nextPageToken: offset + size < items.length ? String(offset + size) : undefined,
    totalResults: items.length };
}

  return items.map(function (item, i) { return { item: item, k: hashStr(seed + ":" + i) }; })
    .sort(function (a, b) { return a.k - b.k; }).map(function (x) { return x.item; });
}
async function demoPopular(o) {
  o = o || {};
  await demoDelay();
  let list = VIDEOS;
  if (o.category) list = VIDEOS.filter(function (v) { return v.categoryId === o.category; });
  return paginate(seededOrder(list, "popular:" + (o.category || "all")), o.pageToken);
}
function scoreVideo(v, terms) {
  const title = v.title.toLowerCase(), ch = v.channelTitle.toLowerCase(),
    tags = (v.tags || []).join(" ").toLowerCase(), desc = v.description.toLowerCase();
  let s = 0;
  terms.forEach(function (t) {
    if (title.indexOf(t) >= 0) s += 10;
    if (ch.indexOf(t) >= 0) s += 6;
    if (tags.indexOf(t) >= 0) s += 4;
    if (desc.indexOf(t) >= 0) s += 1;
  });
  return s;
}
async function demoSearch(o) {
  o = o || {};
  await demoDelay();
  const terms = String(o.q || "").toLowerCase().split(/[\s　]+/).filter(Boolean);
  let pool = VIDEOS;
  if (o.channelId) pool = pool.filter(function (v) { return v.channelId === o.channelId; });
  const scored = pool.map(function (v) { return { v: v, s: terms.length ? scoreVideo(v, terms) : 1 }; })
    .filter(function (x) { return x.s > 0; });
  let items;
  if (o.order === "date") items = scored.map(function (x) { return x.v; }).sort(function (a, b) { return b.publishedAt.localeCompare(a.publishedAt); });
  else if (o.order === "viewCount") items = scored.map(function (x) { return x.v; }).sort(function (a, b) { return b.viewCount - a.viewCount; });
  else if (o.order === "rating") items = scored.map(function (x) { return x.v; }).sort(function (a, b) { return b.likeCount - a.likeCount; });
  else items = scored.sort(function (a, b) { return b.s - a.s; }).map(function (x) { return x.v; });
  if (items.length < 8 && !o.channelId) {
    const rest = seededOrder(VIDEOS.filter(function (v) { return items.indexOf(v) < 0; }), "search:" + o.q);
    items = items.concat(rest);
  }
  return paginate(items, o.pageToken);
}

async function demoComments(videoId, pageToken) {

  const base = hashStr(videoId);

  const now = Date.now();
  const list = [];
  for (let i = 0; i < count; i++) {
    const h = hashStr(videoId + ":" + i);
    const tpl = CMT_TEXTS[(h + i) % CMT_TEXTS.length];

    list.push({

      likeCount: Math.floor(((h % 1000) * (h % 7)) / (i + 1)),

}

/* ---------- dispatcher (official API > live keyless API > demo data) ---------- */
function withLiveFallback(promise, demoFn, args) {
  return promise.catch(async function (err) {
    if (err && err.reason === "commentsDisabled") throw err;
    if (!liveDown) {
      liveDown = true;
      updateStatusBtn();
      toast("ライブAPIに接続できません。デモデータで表示しています");
    }
    return demoFn.apply(null, args);
  });
}

    if (m === "official") return officialFeed(chip, token);
    return demoFeed(chip, token);
  },
  popular: function (o) {

    if (m === "official") return realPopular(o);
    return demoPopular(o);
  },

function toast(msg, actionLabel, actionFn) {
  const root = $("#toasts");
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = '<span>' + esc(msg) + "</span>" +
    (actionLabel ? '<button type="button" data-toast-action>' + esc(actionLabel) + "</button>" : "") +
    '<button type="button" class="x" data-toast-close aria-label="閉じる">' + icon("x", 16) + "</button>";
  root.appendChild(el);
  const close = function () { if (el.parentNode) el.parentNode.removeChild(el); };
  el.addEventListener("click", function (e) {
    const t = e.target.closest("[data-toast-action],[data-toast-close]");
    if (!t) return;
    if (t.hasAttribute("data-toast-action") && actionFn) actionFn();
    close();
  });
  setTimeout(close, 3500);
}

function findVideo(id) {
  if (V_INDEX[id]) return V_INDEX[id];
  const pools = [state.hist, state.liked, state.later];
  for (let i = 0; i < pools.length; i++) {

/* ---------- paged loading ---------- */
function Pager(fetcher) {
  this.fetcher = fetcher;
  this.reset();
}
Pager.prototype.reset = function () {
  this.items = [];
  this.token = undefined;
  this.hasMore = false;
  this.loading = false;
  this.loadingMore = false;
  this.error = null;
  this.total = undefined;
};
Pager.prototype.add = function (list) {
  const self = this;
  (list || []).forEach(function (v) {
    if (!v || !v.id) return;
    if (self.items.some(function (x) { return x.id === v.id; })) return;
    self.items.push(v);
    if (!V_INDEX[v.id]) V_INDEX[v.id] = v;
  });
};
Pager.prototype.load = async function () {
  this.loading = true;
  this.error = null;
  try {
    const r = await this.fetcher(this.token);
    this.add(r.items);
    this.token = r.nextPageToken;
    this.hasMore = !!r.nextPageToken;
    this.total = r.totalResults;
  } catch (e) {
    this.error = e;
  }
  this.loading = false;
  return this;
};
Pager.prototype.loadMore = async function () {
  if (this.loading || this.loadingMore || !this.hasMore) return this;
  this.loadingMore = true;
  try {
    const r = await this.fetcher(this.token);
    this.add(r.items);
    this.token = r.nextPageToken;
    this.hasMore = !!r.nextPageToken;
    this.total = r.totalResults;
  } catch (e) {
    this.error = e;
  }
  this.loadingMore = false;
  return this;
};

const pageData = {};

function attachInfinite(container, pager, renderList) {
  if (container._io) container._io.disconnect();
  const io = new IntersectionObserver(function (entries) {
    if (!entries[0] || !entries[0].isIntersecting) return;
    if (!pager.hasMore || pager.loading || pager.loadingMore) return;
    pager.loadMore().then(function () { renderList(); });
  }, { rootMargin: "600px 0px" });
  io.observe(container);
  container._io = io;
}

const YT_URL_RE = /(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/watch\?(?:[^\s]*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/;
function linkify(text) {
  const parts = String(text).split(/(https?:\/\/[^\s<>"'）)]+|\s?#[^\s#]+)/g);
  return parts.map(function (p) {
    if (!p) return "";
    if (/^https?:\/\//.test(p)) {
      const m = p.match(YT_URL_RE);
      if (m) return '<a href="#/watch?v=' + encodeURIComponent(m[1]) + '">' + esc(p) + "</a>";
      return '<a href="' + esc(p) + '" target="_blank" rel="noreferrer">' + esc(p) + "</a>";
    }
    const tag = p.match(/^(\s?)(#[^\s#]+)$/);
    if (tag) return esc(tag[1]) + '<a href="#/results?search_query=' + encodeURIComponent(tag[2]) + '">' + esc(tag[2]) + "</a>";
    return esc(p);
  }).join("");

function commentHTML(c) {

  return (

      '<div class="grow">' +

    box.innerHTML = disabled
      ? '<h2 class="cmt-count">コメント</h2><div class="notice" style="display:flex;gap:12px;align-items:center">' +
        icon("msgOff", 20) + "この動画ではコメントがオフになっています。</div>"
      : '<h2 class="cmt-count">コメント</h2>' + errorHTML(pager.error, true, "comments");
    return;

  let html = '<h2 class="cmt-count">' +
    (pager.total !== undefined ? pager.total.toLocaleString("ja-JP") + "件のコメント" : "コメント") + "</h2>";
  html += '<div class="cmt-list">';
  pager.items.forEach(function (c) { html += commentHTML(c); });
  if (pager.loading) {
    for (let i = 0; i < 5; i++) {
      html += '<div class="cmt"><div class="sk" style="width:40px;height:40px;border-radius:50%;flex:none"></div>' +

  if (!pager.loading && !pager.items.length) html += '<p class="muted small">まだコメントはありません。</p>';

  if (pager.hasMore && !pager.loadingMore) html += '<button class="btn btn-secondary" data-act="cmt-more" style="margin-top:24px">もっと見る</button>';

function pageFeed(kind) {
  const main = $("#main");
  const conf = {
    history: ["history", "再生履歴", "再生履歴はありません", "動画を再生すると、ここに表示されます。"],
    later: ["clock", "後で見る", "保存した動画はありません", "動画カードの時計アイコンや「保存」ボタンから追加できます。"],
    liked: ["thumbsUp", "高く評価した動画", "高く評価した動画はありません", "動画ページの高評価ボタンから追加できます。"],
    subs: ["tv", "登録チャンネル", "登録チャンネルはありません", "チャンネルページの「チャンネル登録」ボタンから登録できます。"],
  }[kind];
  document.title = conf[1] + " - MyTube";
  main.innerHTML = '<div class="page"><div class="page-head"><div class="badge-ic">' + icon(conf[0], 24) +
    "</div><h1>" + conf[1] + '</h1></div><div id="feed"></div></div>';
  const container = $("#feed");

  if (kind === "history") {
    const render = function (filter) {
      const q = (filter || "").trim().toLowerCase();
      const list = q
        ? state.hist.filter(function (v) {
            return v.title.toLowerCase().indexOf(q) >= 0 || v.channelTitle.toLowerCase().indexOf(q) >= 0;
          })
        : state.hist;
      if (!state.hist.length) {
        container.innerHTML = emptyHTML("history", conf[2], conf[3]);
        return;
      }
      container.innerHTML =
        '<div class="watch-row" style="margin-bottom:20px"><div class="grow">' +
          '<input class="input plain" id="hist-q" placeholder="再生履歴を検索" value="' + esc(filter || "") + '" style="max-width:420px" />' +
        "</div>" +
        '<button class="btn btn-ghost" data-act="clear-history">' + icon("trash", 18) + "再生履歴をすべて削除</button></div>" +
        (list.length
          ? '<div class="feed-list" style="display:flex;flex-direction:column;gap:20px">' +
            list.map(function (v) {
              return '<div style="position:relative">' + listCardHTML(v) +
                '<button class="icon-btn" data-act="del-history" data-id="' + esc(v.id) +
                '" aria-label="履歴から削除" style="position:absolute;right:0;top:0;background:rgba(0,0,0,.55)">' + icon("x", 18) + "</button></div>";
            }).join("") + "</div>"
          : '<p class="muted small" style="padding:40px 0;text-align:center">一致する動画はありません。</p>') +
        '<p class="muted small" style="margin-top:24px">履歴はこのブラウザの localStorage にのみ保存されます（最大200件）。</p>';
      const input = $("#hist-q");
      if (input) {
        input.addEventListener("input", function () {
          const pos = input.selectionStart;
          render(input.value);
          const again = $("#hist-q");
          if (again) { again.focus(); again.setSelectionRange(pos, pos); }
        });
      }
    };
    render("");
    return;
  }

  if (kind === "subs") {
    if (!state.subs.length) {
      container.innerHTML = emptyHTML("tv", conf[2], conf[3], '<a class="btn btn-primary" href="#/">動画を探す</a>');
      return;
    }
    container.innerHTML =
      '<div class="row" style="gap:20px;overflow-x:auto;padding-bottom:16px;margin-bottom:24px;scrollbar-width:none">' +
        state.subs.map(function (c) {
          return '<div style="width:96px;flex:none;text-align:center">' +
            '<a href="#/channel/' + encodeURIComponent(c.id) + '" style="display:flex;justify-content:center">' +
              avatarHTML(c.title, c.thumbnail, 64) + "</a>" +
            '<a href="#/channel/' + encodeURIComponent(c.id) + '" class="small line2" style="display:block;margin:8px 0">' + esc(c.title) + "</a>" +
            subscribeHTML(c) + "</div>";
        }).join("") +
      "</div>" +
      '<h2 style="margin:0 0 16px;font-size:18px;font-weight:500">最新の動画</h2><div id="subs-feed">' + spinnerHTML() + "</div>";
    const targets = state.subs.slice(0, 10);
    Promise.allSettled(targets.map(function (c) { return api.channelPage(c.id); })).then(function (results) {
      let vids = [];
      results.forEach(function (r, i) {
        if (r.status === "fulfilled" && r.value && r.value.items) {
          r.value.items.slice(0, 8).forEach(function (v) {
            vids.push(Object.assign({}, v, { channelThumbnail: v.channelThumbnail || targets[i].thumbnail }));
          });
        }
      });
      vids.sort(function (a, b) { return b.publishedAt.localeCompare(a.publishedAt); });
      const box = $("#subs-feed");
      if (!box) return;
      box.innerHTML = vids.length
        ? '<div class="grid">' + vids.map(gridCardHTML).join("") + "</div>"
        : '<p class="muted small" style="padding:32px 0;text-align:center">表示できる動画がありません。</p>';
    });
    return;
  }

  const list = kind === "later" ? state.later : state.liked;
  container.innerHTML = list.length
    ? '<div class="grid">' + list.map(gridCardHTML).join("") + "</div>"
    : emptyHTML(conf[0], conf[2], conf[3]);
}

/* =========================================================================
   ROUTER
   ========================================================================= */
let currentRoute = { name: "home", path: "/", query: {}, params: {} };
function parseRoute() {
  const raw = (location.hash || "#/").replace(/^#/, "") || "/";
  const split = raw.split("?");
  const path = split[0] || "/";
  const query = {};
  (split[1] || "").split("&").forEach(function (kv) {
    if (!kv) return;
    const i = kv.indexOf("=");
    const k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
    const v = decodeURIComponent((i < 0 ? "" : kv.slice(i + 1)).replace(/\+/g, " "));
    if (k) query[k] = v;
  });
  const seg = path.split("/").filter(Boolean);
  const route = { name: "home", path: path, query: query, params: {} };
  if (seg[0] === "results") route.name = "results";
  else if (seg[0] === "watch") route.name = "watch";
  else if (seg[0] === "channel") { route.name = "channel"; route.params.id = seg[1] || ""; }
  else if (seg[0] === "trending") route.name = "trending";
  else if (seg[0] === "feed") {
    route.name = "feed";
    route.params.kind = seg[1] === "watch-later" ? "later" : seg[1] === "subscriptions" ? "subs" : seg[1] === "liked" ? "liked" : "history";
  }
  return route;
}
function go(hash) {
  if (location.hash === hash) renderRoute();
  else location.hash = hash;
}
function setQuery(patch, replace) {
  const q = Object.assign({}, currentRoute.query, patch);
  Object.keys(q).forEach(function (k) { if (q[k] === "" || q[k] === undefined || q[k] === null) delete q[k]; });
  const qs = Object.keys(q).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(q[k]); }).join("&");
  const url = "#" + currentRoute.path + (qs ? "?" + qs : "");
  if (replace && history.replaceState) {
    history.replaceState(null, "", url);
    currentRoute = parseRoute();
    renderRoute();
  } else go(url);
}

function renderRoute(keepScroll) {
  currentRoute = parseRoute();
  closeMenu();
  updateLayoutMode();
  renderSidebar();
  const y = keepScroll ? window.scrollY : 0;
  switch (currentRoute.name) {
    case "results": pageResults(); break;
    case "watch": pageWatch(); break;
    case "channel": pageChannel(); break;
    case "trending": pageTrending(); break;
    case "feed": pageFeed(currentRoute.params.kind); break;
    default: pageHome();
  }
  if (keepScroll) window.scrollTo(0, y);
  else window.scrollTo(0, 0);
}

   SIDEBAR
   ========================================================================= */
let sidebarExpanded = true;
function updateLayoutMode() {
  const isWatch = currentRoute.name === "watch";
  const w = window.innerWidth;
  document.body.classList.toggle("route-watch", isWatch);
  document.body.classList.remove("sb-expanded", "sb-mini");
  if (isWatch) return;
  if (w >= 1280) document.body.classList.add(sidebarExpanded ? "sb-expanded" : "sb-mini");
  else if (w >= 768) document.body.classList.add("sb-mini");
}

function fetchSuggestions(q) {
  return new Promise(function (resolve) {
    const query = (q || "").trim();
    if (!query) return resolve([]);
    const cb = "__mtsug" + Math.floor(Math.random() * 1e9);
    const script = document.createElement("script");
    let done = false;
    const timer = setTimeout(function () { if (!done) { done = true; cleanup(); resolve([]); } }, 3000);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cb] = function (data) {
      if (done) return;
      done = true;
      cleanup();
      try {
        const raw = data && data[1];
        const list = Array.isArray(raw)
          ? raw.map(function (x) { return Array.isArray(x) ? String(x[0] || "") : String(x || ""); }).filter(Boolean).slice(0, 10)
          : [];
        resolve(list);
      } catch (e) { resolve([]); }
    };
    script.onerror = function () { if (!done) { done = true; cleanup(); resolve([]); } };
    script.charset = "utf-8";
    script.src = "https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&hl=ja&ie=utf-8&oe=utf-8&q=" +
      encodeURIComponent(query) + "&callback=" + cb;
    document.head.appendChild(script);
  });
}

function wireSearch(input, form, box, clearBtn) {
  let items = [];
  let active = -1;
  let timer = null;
  let sugg = [];

  function render() {
    const value = input.value.trim();
    const recent = value
      ? state.recent.filter(function (r) { return r.toLowerCase().indexOf(value.toLowerCase()) >= 0 && r !== value; }).slice(0, 3)
      : state.recent.slice(0, 8);
    items = recent.map(function (r) { return { text: r, recent: true }; })
      .concat(sugg.filter(function (s) { return recent.indexOf(s) < 0; }).map(function (s) { return { text: s, recent: false }; }))
      .slice(0, 10);
    if (!items.length) { box.classList.remove("open"); box.innerHTML = ""; return; }
    box.innerHTML = items.map(function (it, i) {
      return '<div class="suggest-item' + (i === active ? " active" : "") + '" data-sug="' + i + '">' +
        icon(it.recent ? "history" : "search", 20) + '<span class="grow truncate">' + esc(it.text) + "</span>" +
        (it.recent ? '<button class="rm" data-rm="' + esc(it.text) + '">削除</button>' : "") + "</div>";
    }).join("");
    box.classList.add("open");
  }
  function submit(text) {
    const q = (text || "").trim();
    if (!q) return;
    state.recent = [q].concat(state.recent.filter(function (x) { return x !== q; })).slice(0, 10);
    saveLib("recent");
    box.classList.remove("open");
    active = -1;
    input.blur();
    document.body.classList.remove("searching");
    go("#/results?search_query=" + encodeURIComponent(q));
  }

  input.addEventListener("input", function () {
    active = -1;
    form.classList.toggle("has-value", !!input.value);
    clearTimeout(timer);
    if (!input.value.trim()) { sugg = []; render(); return; }
    timer = setTimeout(function () {
      fetchSuggestions(input.value).then(function (list) { sugg = list; render(); });
    }, 180);
    render();
  });
  input.addEventListener("focus", render);
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); active = Math.min(active + 1, items.length - 1); render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = Math.max(active - 1, -1); render(); }
    else if (e.key === "Escape") { box.classList.remove("open"); active = -1; }
    else if (e.key === "Enter" && active >= 0 && items[active]) { e.preventDefault(); submit(items[active].text); }
  });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    submit(input.value);
  });
  box.addEventListener("mousedown", function (e) {
    const rm = e.target.closest("[data-rm]");
    if (rm) {
      e.preventDefault();
      state.recent = state.recent.filter(function (x) { return x !== rm.getAttribute("data-rm"); });
      saveLib("recent");
      render();
      return;
    }
    const it = e.target.closest("[data-sug]");
    if (it) {
      e.preventDefault();
      const idx = Number(it.getAttribute("data-sug"));
      if (items[idx]) submit(items[idx].text);
    }
  });
  document.addEventListener("mousedown", function (e) {
    if (!box.contains(e.target) && e.target !== input) box.classList.remove("open");
  });
  if (clearBtn) {
    clearBtn.addEventListener("click", function () {
      input.value = "";
      form.classList.remove("has-value");
      sugg = [];
      render();
      input.focus();
    });
  }
}

function startVoice(input, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("このブラウザは音声検索に対応していません"); return; }
  try {
    const rec = new SR();
    rec.lang = "ja-JP";
    rec.interimResults = false;
    rec.onresult = function (e) {
      const t = e.results && e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "";
      if (t) {
        input.value = t;
        document.body.classList.remove("searching");
        go("#/results?search_query=" + encodeURIComponent(t));
      }
    };
    rec.onend = function () { btn.classList.remove("listening"); };
    rec.onerror = function () { btn.classList.remove("listening"); toast("音声を認識できませんでした"); };
    btn.classList.add("listening");
    rec.start();
  } catch (e) { btn.classList.remove("listening"); }
}

document.addEventListener("click", async function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.getAttribute("data-act");
  const id = t.getAttribute("data-id");

  if (act === "settings") { e.preventDefault(); openSettings(); return; }
  if (act === "close-modal") { closeSettings(); return; }
  if (act === "close-drawer") { document.body.classList.remove("drawer-open"); return; }
  if (act === "dismiss-live") {
    const b = $("#live-banner") || $(".live-banner");
    if (b) b.style.display = "none";
    try { sessionStorage.setItem("mytube.liveHidden", "1"); } catch (err) {}
    return;
  }
  if (act === "dismiss-demo") {
    const b = $("#demo-banner");
    if (b) b.style.display = "none";
    try { sessionStorage.setItem("mytube.demoHidden", "1"); } catch (err) {}
    return;
  }
  if (act === "menu") { e.preventDefault(); openMenu(t, findVideo(id)); return; }
  if (act === "later") { e.preventDefault(); closeMenu(); toggleLater(id); return; }
  if (act === "like") { e.preventDefault(); closeMenu(); toggleLike(id); return; }
  if (act === "dislike") {
    e.preventDefault();
    t.classList.toggle("on");
    toast(t.classList.contains("on") ? "低評価を付けました" : "低評価を取り消しました");
    return;
  }
  if (act === "copy") {
    e.preventDefault();
    closeMenu();
    try {
      await navigator.clipboard.writeText("https://www.youtube.com/watch?v=" + id);
      toast("リンクをコピーしました");
    } catch (err) { toast("コピーに失敗しました"); }
    return;
  }
  if (act === "openyt") {
    e.preventDefault();
    closeMenu();
    window.open("https://www.youtube.com/watch?v=" + id, "_blank", "noopener");
    return;
  }
  if (act === "share") {
    e.preventDefault();
    const url = "https://www.youtube.com/watch?v=" + id;
    const v = findVideo(id);
    if (navigator.share) {
      try { await navigator.share({ title: v.title || "YouTube", url: url }); } catch (err) {}
    } else {
      try { await navigator.clipboard.writeText(url); toast("リンクをコピーしました"); } catch (err) {}
    }
    return;
  }
  if (act === "sub") {
    e.preventDefault();
    const chId = t.getAttribute("data-ch");
    const v = findVideo(id);
    if (!CH_BY_ID[chId] && v && v.channelId === chId) {
      CH_BY_ID[chId] = { id: chId, title: v.channelTitle, thumbnail: v.channelThumbnail || "",
        description: "", customUrl: "", publishedAt: "" };
    }
    toggleSub(chId);
    return;
  }
  if (act === "chip") { e.preventDefault(); setQuery({ c: t.getAttribute("data-id") }, true); return; }
  if (act === "chipscroll") {
    e.preventDefault();
    const sc = $("#chipbar-scroll");
    if (sc) sc.scrollBy({ left: Number(t.getAttribute("data-dir")) * 320, behavior: "smooth" });
    return;
  }
  if (act === "order") { e.preventDefault(); setQuery({ order: t.getAttribute("data-order") }, true); return; }
  if (act === "trendtab") { e.preventDefault(); setQuery({ c: t.getAttribute("data-id") }, true); return; }
  if (act === "retry") {
    e.preventDefault();
    const target = t.getAttribute("data-target");
    if (target === "feed" || target === "feed-more") {
      const p = pageData.feed;
      if (p) (target === "feed" ? p.load() : p.loadMore()).then(function () { renderRoute(true); });
    } else if (target === "comments") {
      const p = pageData.comments;
      if (p) p.load().then(function () { renderComments($("#comments-box"), p); });
    } else renderRoute(true);
    return;
  }
  if (act === "cmt-more") {
    e.preventDefault();
    const p = pageData.comments;
    if (p) p.loadMore().then(function () { renderComments($("#comments-box"), p); });
    return;
  }
  if (act === "cmt-expand") {
    e.preventDefault();
    const p = t.parentNode.querySelector(".text");
    if (p) p.classList.remove("line4");
    t.style.display = "none";
    return;
  }
  if (act === "desc-open") {
    if (e.target.closest && e.target.closest("a")) return;
    const body = $("#desc-body"), more = $("#desc-more");
    if (!body) return;
    if (body.classList.contains("line3")) {
      body.classList.remove("line3");
      if (more) more.textContent = "一部を表示";
      t.classList.add("open");
    } else {
      body.classList.add("line3");
      if (more) more.textContent = "...もっと見る";
      t.classList.remove("open");
    }
    return;
  }
  if (act === "ch-desc") { t.classList.toggle("line2"); return; }
  if (act === "clear-history") {
    e.preventDefault();
    state.hist = [];
    saveLib("hist");
    toast("再生履歴をすべて削除しました");
    closeSettings();
    renderSidebar();
    renderRoute(true);
    return;
  }
  if (act === "del-history") {
    e.preventDefault();
    state.hist = state.hist.filter(function (x) { return x.id !== id; });
    saveLib("hist");
    renderSidebar();
    renderRoute(true);
    return;
  }
  if (act === "clear-cache") { e.preventDefault(); clearCache(); toast("APIキャッシュを削除しました"); return; }
  if (act === "source") {
    e.preventDefault();
    const src = t.getAttribute("data-id");
    state.source = src;
    store.setRaw(KEYS.source, src);
    if (src === "official" && !hasKey()) toast("APIキーが未設定のため、保存時にライブAPIへ戻ります");
    clearCache();
    closeSettings();
    renderRoute(true);
    return;
  }
  if (act === "reconnect") {
    e.preventDefault();
    liveDown = false;
    clearCache();
    updateStatusBtn();
    toast("ライブAPIに再接続します");
    closeSettings();
    renderRoute(true);
    return;
  }
  if (act === "region") {
    e.preventDefault();
    state.region = t.getAttribute("data-id");
    store.setRaw(KEYS.region, state.region);
    clearCache();
    openSettings();
    renderRoute(true);
    return;
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
$("#menu-btn").addEventListener("click", function () {
  if (currentRoute.name !== "watch" && window.innerWidth >= 768) {
    sidebarExpanded = !sidebarExpanded;
    updateLayoutMode();
    renderSidebar();
  } else {
    document.body.classList.toggle("drawer-open");
  }
});
$("#drawer-overlay").addEventListener("click", function () { document.body.classList.remove("drawer-open"); });
$("#settings-btn").addEventListener("click", openSettings);
$("#account-btn").addEventListener("click", openSettings);
$("#status-btn").addEventListener("click", openSettings);
$("#search-open-btn").addEventListener("click", function () {
  document.body.classList.add("searching");
  setTimeout(function () { $("#ms-input").focus(); }, 30);
});
$("#ms-back").addEventListener("click", function () { document.body.classList.remove("searching"); });

wireSearch($("#search-input"), $("#search-form"), $("#suggest"), $("#search-clear"));
wireSearch($("#ms-input"), $("#ms-form"), $("#ms-suggest"), null);
$("#mic-btn").addEventListener("click", function () { startVoice($("#search-input"), this); });
$("#mic-btn-m").addEventListener("click", function () { startVoice($("#ms-input"), this); });

document.addEventListener("keydown", function (e) {
  const tag = e.target && e.target.tagName;
  if (e.key === "/" && tag !== "INPUT" && tag !== "TEXTAREA") {
    e.preventDefault();
    if (window.innerWidth >= 768) $("#search-input").focus();
    else {
      document.body.classList.add("searching");
      $("#ms-input").focus();
    }
  }
  if (e.key === "Escape") {
    closeMenu();
    closeSettings();
    document.body.classList.remove("drawer-open");
    document.body.classList.remove("searching");
  }
});

window.addEventListener("hashchange", function () {
  document.body.classList.remove("drawer-open");
  document.body.classList.remove("searching");
  renderRoute();
});
let resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    updateLayoutMode();
    renderSidebar();
  }, 120);
});

updateLayoutMode();
renderSidebar();
renderRoute();
</script>
</body>
</html>
